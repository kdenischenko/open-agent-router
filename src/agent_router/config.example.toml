# adjust windows and limits to your plan

[server]
port = 8787

# [usage]
# mode = "auto"    # "auto" reads usage sources; "manual" is calibration only
# interval = "1h"  # how often usage sources are read

[tasks]
allowed_roots = []
denied_roots = []
max_parallel = 3
max_queued = 200
max_attempts = 3
# hard cap for a job: a per-job timeout_s or route.timeout_s replaces it
default_timeout_s = 14400
# stop the job when the harness prints nothing for this long; 0 disables the check
idle_timeout_s = 600
approval_timeout_s = 600
limit_backoff_s = 1800
limit_backoff_max_s = 18000
# how long a route stays out of rotation after its model is reported unavailable
model_unavailable_cooldown_s = 1800
max_prompt_chars = 200000
exit_grace_s = 60

[callers]
claude-code = "claude-pro"
codex = "chatgpt-plus"
kimi-code = "kimi-code"
opencode = "opencode-go"
# cline runs on the opencode go plan, so its jobs skip that pool
cline = "opencode-go"

[backends.claude]
executable = ""

[backends.cline]
executable = ""

[backends.codex]
executable = ""

[backends.kimi]
executable = ""

[backends.opencode]
executable = ""

[statusline]
pool = "claude-pro"

[classifier]
kind = "none"
# mode = "shadow"
# primary = "tev1"
# min_confidence = 0.6
# write_floor = "standard"
# vram_budget_mb = 5300
#
# [[classifier.models]]
# id = "tev1"
# kind = "systemone"
# model = "tev1:4b-q4_K_M"
# timeout_s = 3

[storage]
backend = "sqlite"
# retention_days = 30  # omit to keep job history forever; purge is manual

# [[sinks]]
# type = "jsonl"
# path = "events.jsonl"

# webhook notifications, e.g. an ntfy topic; the URL is a secret and comes only from
# the environment variable named by url_env, never from this file
# [[sinks]]
# type = "webhook"
# url_env = "AGENT_ROUTER_WEBHOOK_URL"  # e.g. https://ntfy.sh/<your-topic>
# format = "text"  # "json" (default) posts the event payload; "text" posts one line
# events = ["job.completed", "job.failed"]  # optional; without it every event is posted
# base_url = "http://127.0.0.1:8787"  # optional: adds a dashboard link to each message
# timeout_s = 5  # a positive number of seconds per attempt

[[pools]]
id = "claude-pro"
title = "Claude Pro"
unit = "percent"
reserve = 0.15
reserve_tier = "strong"

  [[pools.windows]]
  id = "5h"
  duration = "5h"
  kind = "fixed"
  role = "guard"

  [[pools.windows]]
  id = "week"
  duration = "7d"
  kind = "fixed"
  role = "pace"

[[pools]]
id = "kimi-code"
title = "Kimi Code"
unit = "percent"

  [[pools.windows]]
  id = "5h"
  duration = "5h"
  kind = "rolling"
  role = "guard"

  [[pools.windows]]
  id = "month"
  duration = "1mo"
  kind = "fixed"
  role = "pace"

  # [pools.usage]
  # source = "kimi-code"  # read the Kimi Code plan's usage from the Kimi Code CLI (2.8.1+)
  # windows = { limit5h = "5h", monthTotal = "month" }

[[pools]]
id = "chatgpt-plus"
title = "ChatGPT Plus"
unit = "percent"

  [[pools.windows]]
  id = "5h"
  duration = "5h"
  kind = "fixed"
  role = "guard"

  [[pools.windows]]
  id = "week"
  duration = "7d"
  kind = "fixed"
  role = "pace"

  # [pools.usage]
  # source = "codex"  # read the ChatGPT plan's usage from the Codex CLI
  # windows = { primary = "5h", secondary = "week" }

[[pools]]
id = "opencode-go"
title = "OpenCode Go"
unit = "usd"
counter = "opencode_stats"
counter_provider = "opencode-go"

  [[pools.windows]]
  id = "5h"
  duration = "5h"
  kind = "rolling"
  role = "guard"
  limit_usd = 10  # set your plan limit

  [[pools.windows]]
  id = "week"
  duration = "7d"
  kind = "rolling"
  role = "guard"
  limit_usd = 10  # set your plan limit

  [[pools.windows]]
  id = "month"
  duration = "1mo"
  kind = "fixed"
  role = "pace"
  limit_usd = 10  # set your plan limit

  # [pools.usage]
  # source = "opencode-go"          # read the plan's usage from OpenCode
  # api_key_env = "OPENCODE_GO_API_KEY"
  # windows = { rolling = "5h", weekly = "week", monthly = "month" }

[[routes]]
id = "claude-cli/sonnet"
pool = "claude-pro"
backend = "claude"
model = "sonnet"
tiers = ["standard", "strong"]
quality = 5
modes = ["read", "write"]
confirm = true
enabled = true

# Codex on the ChatGPT plan: fast and affordable model for easier jobs
[[routes]]
id = "codex/gpt-6-luna"
pool = "chatgpt-plus"
backend = "codex"
model = "gpt-6-luna"
tiers = ["cheap"]
quality = 3
modes = ["read", "write"]
confirm = true
enabled = false

# Codex default model for coding and everyday work
[[routes]]
id = "codex/gpt-6.2-sol"
pool = "chatgpt-plus"
backend = "codex"
model = "gpt-6.2-sol"
tiers = ["standard"]
quality = 4
modes = ["read", "write"]
confirm = true
enabled = false

# efficient model, strongest at visual understanding and computer use
[[routes]]
id = "codex/gpt-6.1-terra"
pool = "chatgpt-plus"
backend = "codex"
model = "gpt-6.1-terra"
tiers = ["standard"]
quality = 3
modes = ["read", "write"]
confirm = true
enabled = false

# most capable model for complex coding
[[routes]]
id = "codex/gpt-6.2-astra"
pool = "chatgpt-plus"
backend = "codex"
model = "gpt-6.2-astra"
tiers = ["strong"]
quality = 5
modes = ["read", "write"]
confirm = true
enabled = false

[[routes]]
id = "kimi-cli/k3.1-pro"
pool = "kimi-code"
backend = "kimi"
model = "kimi-code/k3.1-pro"
model_key = "kimi-k3.1-pro"
tiers = ["standard", "strong"]
quality = 4
modes = ["read", "write"]
confirm = true
enabled = true

[[routes]]
id = "kimi-cli/kimi-for-coding"
pool = "kimi-code"
backend = "kimi"
model = "kimi-code/kimi-for-coding"
tiers = ["cheap", "standard"]
quality = 3
modes = ["read", "write"]
confirm = true
enabled = true

[[routes]]
id = "opencode-cli/glm-5.3-flash"
pool = "opencode-go"
backend = "opencode"
model = "opencode-go/glm-5.3-flash"
tiers = ["cheap"]
quality = 2
modes = ["read", "write"]
confirm = true
enabled = true

# OpenCode CLI on the OpenCode Go pool: model is "<provider>/<model>"
[[routes]]
id = "opencode-cli/glm-5.3"
pool = "opencode-go"
backend = "opencode"
model = "opencode-go/glm-5.3"
model_key = "glm-5.3"
tiers = ["standard"]
quality = 4
modes = ["read", "write"]
confirm = true
enabled = true

# Cline CLI on the OpenCode Go pool: model is "<provider>/<model>"
[[routes]]
id = "cline/glm-5.3"
pool = "opencode-go"
backend = "cline"
model = "opencode-go/glm-5.3"
model_key = "glm-5.3"
tiers = ["standard"]
quality = 4
modes = ["read", "write"]
confirm = true
enabled = false

# One model across several subscriptions: pool preference order
[models."kimi-k3.1-pro"]
prefer = ["kimi-code", "opencode-go"]

[models."glm-5.3"]
prefer = ["opencode-go"]

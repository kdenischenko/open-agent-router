name: Feature request
description: A new harness, a routing idea or another improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check [ROADMAP.md](https://github.com/kdenischenko/open-agent-router/blob/main/ROADMAP.md) first — it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work; config or CLI sketch welcome
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you use or do now instead

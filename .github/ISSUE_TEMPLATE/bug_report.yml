name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go to *Security → Report a vulnerability*, not here.
        Remove tokens, prompts with private code and personal paths from logs before posting.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`uv tool list` shows it, or the commit hash"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, Python version, harnesses involved (OpenCode, Kimi Code, Cline, Claude Code)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: Commands and the relevant part of `config.toml`
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Output, error code, `agent-router result <id>` if a job is involved
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

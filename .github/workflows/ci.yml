name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.7"
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest -q

      - name: Test without installed CLIs
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          uv_bin="$(command -v uv)"
          export PATH="/usr/bin:/bin"
          for cli in claude kimi opencode codex cline; do
            if command -v "$cli" >/dev/null; then
              echo "::error::$cli must not be on PATH"
              exit 1
            fi
          done
          "$uv_bin" run pytest -q

      - name: Build
        run: uv build

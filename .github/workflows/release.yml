name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Tests and the build run without the right to publish anything.
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.7"
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest -q

      - name: Check tag version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".Substring(1)
          $projectVersion = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ($tagVersion -ne $projectVersion) {
            Write-Error "tag version $tagVersion does not match pyproject.toml version $projectVersion"
            exit 1
          }

      - name: Release notes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory -Force notes | Out-Null
          uv run python .github/scripts/release_notes.py $version --output notes/release-notes.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build
        run: uv build

      - name: Smoke test the wheel
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $wheel = (Get-ChildItem "$env:GITHUB_WORKSPACE/dist/*.whl").FullName
          $env:AGENT_ROUTER_HOME = Join-Path $env:RUNNER_TEMP "agent-router-home"
          $run = @("run", "--isolated", "--no-project", "--python", "3.12", "--with", $wheel)
          uv @run agent-router --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv @run agent-router init
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv @run python -c "import agent_router, pathlib; from agent_router.config import home_dir, load_config; load_config(home_dir() / 'config.toml'); root = pathlib.Path(agent_router.__file__).parent; assert any((root / 'static').iterdir()) and any((root / 'templates').iterdir())"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/release-notes.md
          if-no-files-found: error

  # Only this job can publish to PyPI; it runs no project code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.7"
          enable-cache: false

      - name: Publish
        run: uv publish --trusted-publishing always

  # The GitHub release appears only once the version is on PyPI.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes-file notes/release-notes.md "${prerelease[@]}"

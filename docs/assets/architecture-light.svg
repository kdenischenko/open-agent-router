<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 900" width="1260" height="900" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">open-agent-router architecture</title>
<desc id="arch-desc">An orchestrator agent submits jobs through the agent-router CLI or the MCP server, and you approve and calibrate through the CLI or the web dashboard. The gateway checks tokens, the dispatcher asks the optional tier classifier for a tier and the route policy for a route ranked by pace urgency from the ledger, then the runner starts a coding agent CLI in the job directory. Usage figures come from manual calibration, the Claude Code status line, the OpenCode Go usage API, the opencode stats counter and the harness journal.</desc>
